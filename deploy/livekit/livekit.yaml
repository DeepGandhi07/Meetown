port: 7880
rtc:
  tcp_port: 7881            # TCP fallback for media
  port_range_start: 50000   # UDP media range - open in the firewall
  port_range_end: 60000
  use_external_ip: true
# Keys come from the LIVEKIT_KEYS env var set in docker-compose.yml.
# Strongly recommended for users behind strict firewalls / corporate networks:
# enable the built-in TURN server (needs a certificate for your domain).
# turn:
#   enabled: true
#   domain: livekit-turn.example.com
#   tls_port: 5349
#   udp_port: 3478
#   cert_file: /certs/fullchain.pem
#   key_file: /certs/privkey.pem
